# Reunião CliqFast (Meet) no servidor da casa.
# - reuniao.cliqfast.com.br chega pelo túnel do Cloudflare (cliqfast-sandbox) em 127.0.0.1:8095.
# - Vídeo pelo LiveKit Cloud (sem LiveKit aqui) e login pelo Cloudflare Access (OIDC).
# - Segredos em ~/sandbox/meet/config/.env, fora do código; banco no volume meet-db.
# Na pasta do projeto, no notebook: sandbox up | sandbox rebuild | sandbox logs | sandbox status
services:
  postgresql:
    image: postgres:16
    restart: unless-stopped
    env_file: [../../../config/.env]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 150
    volumes:
      - meet-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: backend-production
      args:
        DOCKER_USER: "1000"
    image: cliqfast/meet-backend:local
    restart: unless-stopped
    env_file: [../../../config/.env]
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 15s
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ../..
      dockerfile: src/frontend/Dockerfile
      target: frontend-production
      args:
        DOCKER_USER: "1000"
        VITE_APP_TITLE: "Reunião CliqFast"
    image: cliqfast/meet-frontend:local
    restart: unless-stopped

  # Mesmo papel do default.conf.template do projeto: /api, /admin e /static no backend, o resto no front.
  proxy:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine3.24
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_HOST: backend
      FRONTEND_INTERNAL_HOST: frontend
    volumes:
      - ./proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:8095:8083"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  meet-db:
